services:
  # Backend API service
  - type: web
    name: fashion-store-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_TYPE
        value: postgres
      - key: PORT
        value: 10000
      - key: POSTGRES_URL
        fromDatabase:
          name: fashion-store-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # This will generate a random value for the JWT secret

# PostgreSQL Database
databases:
  - name: fashion-store-db
    databaseName: fashion_store
    plan: free # or choose a paid plan for production
    ipAllowList: [] # only allow internal connections

# Add a job to set up the database after deployment
jobs:
  - name: database-setup
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/utils/rebuildProductsTable.js
    envVars:
      - key: POSTGRES_URL
        fromDatabase:
          name: fashion-store-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres 
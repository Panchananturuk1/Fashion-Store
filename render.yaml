services:
  # Backend API service
  - type: web
    name: fashion-store-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_TYPE
        value: postgres
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://root:8sIEDzISyEu2abVDLuIo2kXb2KNwCGei@dpg-d05rqvidbo4c73906vm0-a.oregon-postgres.render.com/ecommerce_r8fr
      - key: JWT_SECRET
        generateValue: true # This will generate a random value for the JWT secret

# Add a job to set up the database after deployment
jobs:
  - name: database-setup
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/utils/rebuildProductsTable.js
    envVars:
      - key: DB_TYPE
        value: postgres
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://root:8sIEDzISyEu2abVDLuIo2kXb2KNwCGei@dpg-d05rqvidbo4c73906vm0-a.oregon-postgres.render.com/ecommerce_r8fr 
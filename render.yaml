services:
  # Backend API service
  - type: web
    name: fashion-store-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node render-start.js
    envVars:
      - key: DB_TYPE
        value: postgres
      - key: PORT
        value: 10000
      - key: PG_HOST
        fromDatabase:
          name: fashion-store-db
          property: host
      - key: PG_USER
        fromDatabase:
          name: fashion-store-db
          property: user
      - key: PG_PASSWORD
        fromDatabase:
          name: fashion-store-db
          property: password
      - key: PG_DATABASE
        fromDatabase:
          name: fashion-store-db
          property: database
      - key: PG_PORT
        fromDatabase:
          name: fashion-store-db
          property: port
      - key: PG_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true # This will generate a random value for the JWT secret
      - key: NODE_ENV
        value: production

# PostgreSQL Database
databases:
  - name: fashion-store-db
    databaseName: fashion_store
    plan: free # or choose a paid plan for production

# Add a job to set up the database after deployment
jobs:
  - name: database-setup
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/utils/rebuildProductsTable.js
    envVars:
      - key: PG_HOST
        fromDatabase:
          name: fashion-store-db
          property: host
      - key: PG_USER
        fromDatabase:
          name: fashion-store-db
          property: user
      - key: PG_PASSWORD
        fromDatabase:
          name: fashion-store-db
          property: password
      - key: PG_DATABASE
        fromDatabase:
          name: fashion-store-db
          property: database
      - key: PG_PORT
        fromDatabase:
          name: fashion-store-db
          property: port
      - key: PG_SSL
        value: "true"
      - key: DB_TYPE
        value: postgres 
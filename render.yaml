services:
  # Backend API service
  - type: web
    name: fashion-store-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_TYPE
        value: postgres
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: PGHOST
        value: dpg-d05rqvidbo4c73906vm0-a.oregon-postgres.render.com
      - key: PGUSER
        value: root
      - key: PGPASSWORD
        value: 8sIEDzISyEu2abVDLuIo2kXb2KNwCGei
      - key: PGDATABASE
        value: ecommerce_r8fr
      - key: PGPORT
        value: 5432
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true # This will generate a random value for the JWT secret

# Add a job to set up the database after deployment
jobs:
  - name: database-setup
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/utils/rebuildProductsTable.js
    envVars:
      - key: DB_TYPE
        value: postgres
      - key: NODE_ENV
        value: production
      - key: PGHOST
        value: dpg-d05rqvidbo4c73906vm0-a.oregon-postgres.render.com
      - key: PGUSER
        value: root
      - key: PGPASSWORD
        value: 8sIEDzISyEu2abVDLuIo2kXb2KNwCGei
      - key: PGDATABASE
        value: ecommerce_r8fr
      - key: PGPORT
        value: 5432
      - key: PGSSL
        value: "true" 
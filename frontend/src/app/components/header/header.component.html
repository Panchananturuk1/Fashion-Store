<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Fashion Store</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products/men" routerLinkActive="active">Men</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products/women" routerLinkActive="active">Women</a>
        </li>
        <!-- Only show Add Product link for admin users -->
        <li class="nav-item" *ngIf="isAdmin()">
          <a class="nav-link" routerLink="/add-product" routerLinkActive="active">Add Product</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <!-- Cart Icon - only shown when logged in -->
        <li class="nav-item" *ngIf="isLoggedIn()">
          <a class="nav-link position-relative" routerLink="/cart" routerLinkActive="active">
            <i class="bi bi-cart-fill"></i> Cart
            <span *ngIf="cartItemCount > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              {{ cartItemCount }}
              <span class="visually-hidden">items in cart</span>
            </span>
          </a>
        </li>
        
        <!-- User dropdown menu when logged in -->
        <li class="nav-item dropdown" *ngIf="isLoggedIn()">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" 
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" routerLink="/profile">My Profile</a></li>
            <li><a class="dropdown-item" routerLink="/orders">My Orders</a></li>
            <li><hr class="dropdown-divider"></li>
            <!-- Only show Dashboard for admin -->
            <li *ngIf="isAdmin()"><a class="dropdown-item" routerLink="/dashboard">Dashboard</a></li>
            <li><a class="dropdown-item" href="#" (click)="logout($event)">Logout</a></li>
          </ul>
        </li>

        <!-- Login/Register links when not logged in -->
        <li class="nav-item" *ngIf="!isLoggedIn()">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
        </li>
        <li class="nav-item" *ngIf="!isLoggedIn()">
          <a class="nav-link" routerLink="/register" routerLinkActive="active">Register</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
